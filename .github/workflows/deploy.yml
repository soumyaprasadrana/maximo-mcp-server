name: Deploy docs to GitHub Pages

# Builds the VitePress site and publishes it to GitHub Pages automatically.
# Enable once in the repo: Settings → Pages → Build and deployment → Source → "GitHub Actions".
# No gh-pages branch and no committed build output are needed.

on:
  # Publish on every push to the default branch.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for lastUpdated timestamps

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        # DOCS_BASE MUST match how the site is served:
        #   Project page  → "/<repo-name>/"   (e.g. /maximo-mcp-server-docs/)
        #   User/org page → "/"
        #   Custom domain → "/"  (and add a docs/public/CNAME file)
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
